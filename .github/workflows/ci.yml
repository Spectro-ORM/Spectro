name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: Test and application acceptance (macOS)
    runs-on: macos-15
    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "55432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.0.3"

      - name: Build
        run: swift build

      - name: Start PostgreSQL
        run: |
          brew install postgresql@16
          pg_bin="$(brew --prefix postgresql@16)/bin"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/spectro-pg" -U postgres -A trust
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/spectro-pg" -l "$RUNNER_TEMP/spectro-pg.log" -o "-h 127.0.0.1 -p 55432" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U postgres spectro_test

      - name: Run tests
        run: swift test --jobs 4

      - name: Setup Swift for Peregrine dependencies
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"

      - name: Run HTTP application acceptance
        run: python3 scripts/acceptance.py

      - name: Stop PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/spectro-pg/postmaster.pid" ]; then
            "$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$RUNNER_TEMP/spectro-pg" -m fast -w stop
          fi

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spectro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          TEST_DB_NAME: spectro_test
        run: swift test --jobs 4
